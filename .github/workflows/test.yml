name: Run tests

# Linux: Ubicloud (`ubicloud`). Windows/macOS: GitHub-hosted (`windows-latest`, `macos-latest`).
# See: https://www.ubicloud.com/docs/github-actions-integration/quickstart
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-rust-compat:
    runs-on: ubicloud
    strategy:
      matrix:
        rust_version: ["1.94", "1.97"]
    steps:
      - name: rustup toolchain install ${{ matrix.rust_version }}
        run: |
          rustup toolchain install ${{ matrix.rust_version }}

      - uses: actions/checkout@v4

      - run: rustup override set ${{ matrix.rust_version }}

      - run: rustup component add rustfmt clippy

      - name: cargo check
        run: cargo check

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy check
        run: cargo clippy --all-targets

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubicloud
            os_kind: linux
          - runner: windows-latest
            os_kind: windows
          - runner: macos-latest
            os_kind: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-${{ matrix.runner }}

      - name: Run tests (Linux)
        if: matrix.os_kind == 'linux'
        run: cargo test

      - name: Run tests (Windows)
        if: matrix.os_kind == 'windows'
        # Exclude Tauri desktop: generate_context! requires frontend dist/ which CI does not build.
        run: cargo test --workspace --exclude rqbit-desktop

      - name: Run tests (macOS)
        if: matrix.os_kind == 'macos'
        # Exclude Tauri desktop: same as Windows — frontend dist/ not built in this job.
        run: ulimit -n unlimited && cargo test --workspace --exclude rqbit-desktop

  desktop-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-desktop-windows
          workspaces: desktop/src-tauri -> target

      - name: npm install (workspace)
        run: npm install

      - name: Build desktop frontend
        working-directory: desktop
        run: npm run build

      - name: cargo check rqbit-desktop
        run: cargo check -p rqbit-desktop
